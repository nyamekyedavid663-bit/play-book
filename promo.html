<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Play Book Promo 💗</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#111;font-family:'Segoe UI',Georgia,serif;padding:1rem}
  .poster{width:380px;max-width:92vw;aspect-ratio:9/16;background:linear-gradient(160deg,#ff9a9e 0%,#fecfef 35%,#fc6076 70%,#8a0f3c 100%);border-radius:28px;padding:2rem 1.5rem;text-align:center;color:#fff;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .emoji{font-size:3rem}
  h1{font-size:2.6rem;font-family:Georgia,serif;margin:.3rem 0}
  .sub{font-style:italic;opacity:.95;margin-bottom:1rem}
  .steps{background:rgba(255,255,255,.95);color:#8a0f3c;border-radius:18px;padding:1rem;text-align:left;font-size:.95rem;line-height:1.7}
  .url{background:#111;color:#fff;border-radius:12px;padding:.8rem;margin-top:1rem;font-weight:800;word-break:break-all}
  .cta{margin-top:1rem;background:#25D366;color:#fff;font-weight:800;padding:1rem;border-radius:999px;font-size:1.1rem}
  .small{font-size:.85rem;opacity:.9;margin-top:.6rem}
</style>
</head>
<body>
<div class="poster">
  <div>
    <div class="emoji">📖❤️</div>
    <h1>Play Book</h1>
    <div class="sub">your romantic playbook</div>
    <div class="steps">
      💘 1. Create account in 10s<br/>
      ✨ 2. Type crush name → Generate link<br/>
      💬 3. Send on WhatsApp<br/>
      😂 No runs away… Yes = confetti + Yes to YOU
    </div>
  </div>
  <div>
    <div class="url">👇 TRY IT 👇<br/>play-book-three.vercel.app</div>
    <div class="cta">Shoot your shot 💗</div>
    <div class="small">Screenshot this → post to Status / TikTok / Reels</div>
  </div>
</div>
</body>
</html>
